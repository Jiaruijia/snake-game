<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>贪吃蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 24px;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
            margin-bottom: 24px;
        }

        .score-item {
            padding: 8px 20px;
        }

        .score-label {
            color: #999;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .score-value {
            color: #333;
            font-size: 1.5rem;
            font-weight: 300;
        }

        #gameCanvas {
            border: 1px solid #e0e0e0;
            display: block;
            margin: 0 auto;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 40px 60px;
            border: 1px solid #e0e0e0;
            text-align: center;
            display: none;
            z-index: 100;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            color: #333;
            font-size: 1.25rem;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .game-over p {
            color: #666;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .restart-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 32px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 1px;
        }

        .restart-btn:hover {
            background: #555;
        }

        .instructions {
            color: #999;
            margin-top: 20px;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.25rem;
            }

            .score-board {
                gap: 30px;
            }

            .score-value {
                font-size: 1.25rem;
            }

            #gameCanvas {
                max-width: 90vw;
                max-height: 90vw;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>贪吃蛇</h1>
        <div class="score-board">
            <div class="score-item">
                <div class="score-label">分数</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">最高分</div>
                <div class="score-value" id="highScore">0</div>
            </div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <p class="instructions">方向键控制 • 手机滑动操作</p>
    </div>

    <div class="game-over" id="gameOver">
        <h2>游戏结束</h2>
        <p>分数: <span id="finalScore">0</span></p>
        <button class="restart-btn" onclick="restartGame()">再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');

        // 游戏配置
        const gridSize = 20;
        let tileCount = canvas.width / gridSize;
        let gameSpeed = 100;

        // 游戏状态
        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gameLoop;

        // 响应式画布
        function resizeCanvas() {
            const maxSize = Math.min(window.innerWidth - 40, window.innerHeight - 200, 400);
            const size = Math.floor(maxSize / gridSize) * gridSize;
            canvas.width = size;
            canvas.height = size;
            tileCount = size / gridSize;
        }

        // 初始化游戏
        function initGame() {
            resizeCanvas();
            highScoreEl.textContent = highScore;
            resetGame();
            drawGame();
        }

        function resetGame() {
            snake = [
                {x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2)},
                {x: Math.floor(tileCount / 2) - 1, y: Math.floor(tileCount / 2)},
                {x: Math.floor(tileCount / 2) - 2, y: Math.floor(tileCount / 2)}
            ];
            dx = 1;
            dy = 0;
            score = 0;
            scoreEl.textContent = score;
            spawnFood();
        }

        function spawnFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }

        // 绘制游戏
        function drawGame() {
            // 清空画布 - 白色背景
            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制网格线
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // 绘制蛇
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#333' : '#666';
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            // 绘制食物 - 简单红色圆点
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 4,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        // 游戏循环
        function update() {
            if (!gameRunning) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // 撞墙检测
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // 撞自己检测
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // 吃食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                spawnFood();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            finalScoreEl.textContent = score;
            gameOverEl.classList.add('show');
        }

        function restartGame() {
            gameOverEl.classList.remove('show');
            resetGame();
            gameRunning = true;
            gameLoop = setInterval(update, gameSpeed);
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) {
                if (e.key === 'Enter' || e.key === ' ') {
                    restartGame();
                }
                return;
            }

            switch (e.key) {
                case 'ArrowUp':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
            }
            e.preventDefault();
        });

        // 触摸控制
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            if (!gameRunning) {
                restartGame();
            }
        }, {passive: true});

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, {passive: false});

        canvas.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].clientX;
            touchEndY = e.changedTouches[0].clientY;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            const minSwipe = 30;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (Math.abs(deltaX) > minSwipe) {
                    if (deltaX > 0 && dx !== -1) {
                        dx = 1; dy = 0;
                    } else if (deltaX < 0 && dx !== 1) {
                        dx = -1; dy = 0;
                    }
                }
            } else {
                if (Math.abs(deltaY) > minSwipe) {
                    if (deltaY > 0 && dy !== -1) {
                        dx = 0; dy = 1;
                    } else if (deltaY < 0 && dy !== 1) {
                        dx = 0; dy = -1;
                    }
                }
            }
        }

        // 窗口调整
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (!gameRunning) drawGame();
        });

        // 初始化
        initGame();

        // 点击开始
        canvas.addEventListener('click', () => {
            if (!gameRunning) restartGame();
        });
    </script>
</body>
</html>
