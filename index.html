<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>霓虹贪吃蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff, 0 0 40px #00f0ff;
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .score-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 25px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-label {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-value {
            color: #ff00ff;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px #ff00ff;
        }

        #gameCanvas {
            border: 3px solid #00f0ff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3),
                        inset 0 0 60px rgba(0, 240, 255, 0.1);
            background: rgba(0, 0, 0, 0.5);
            display: block;
            margin: 0 auto;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #ff0066;
            box-shadow: 0 0 50px rgba(255, 0, 102, 0.5);
            text-align: center;
            display: none;
            z-index: 100;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            color: #ff0066;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff0066;
        }

        .game-over p {
            color: #ccc;
            margin-bottom: 30px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #ff0066, #ff00ff);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255, 0, 102, 0.5);
        }

        .restart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(255, 0, 102, 0.8);
        }

        .instructions {
            color: #666;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            .score-board {
                max-width: 320px;
            }

            .score-value {
                font-size: 1.2rem;
            }

            #gameCanvas {
                max-width: 90vw;
                max-height: 90vw;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>霓虹贪吃蛇</h1>
        <div class="score-board">
            <div class="score-item">
                <div class="score-label">分数</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">最高分</div>
                <div class="score-value" id="highScore">0</div>
            </div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <p class="instructions">方向键控制 • 手机滑动操作</p>
    </div>

    <div class="game-over" id="gameOver">
        <h2>游戏结束!</h2>
        <p>你的分数: <span id="finalScore">0</span></p>
        <button class="restart-btn" onclick="restartGame()">再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');

        // 游戏配置
        const gridSize = 20;
        let tileCount = canvas.width / gridSize;
        let gameSpeed = 100;

        // 游戏状态
        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gameLoop;

        // 响应式画布
        function resizeCanvas() {
            const maxSize = Math.min(window.innerWidth - 40, window.innerHeight - 200, 400);
            const size = Math.floor(maxSize / gridSize) * gridSize;
            canvas.width = size;
            canvas.height = size;
            tileCount = size / gridSize;
        }

        // 初始化游戏
        function initGame() {
            resizeCanvas();
            highScoreEl.textContent = highScore;
            resetGame();
            drawGame();
        }

        function resetGame() {
            snake = [
                {x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2)},
                {x: Math.floor(tileCount / 2) - 1, y: Math.floor(tileCount / 2)},
                {x: Math.floor(tileCount / 2) - 2, y: Math.floor(tileCount / 2)}
            ];
            dx = 1;
            dy = 0;
            score = 0;
            scoreEl.textContent = score;
            spawnFood();
        }

        function spawnFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }

        // 绘制游戏
        function drawGame() {
            // 清空画布
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制蛇
            snake.forEach((segment, index) => {
                const gradient = ctx.createRadialGradient(
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    0,
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    gridSize / 2
                );

                if (index === 0) {
                    gradient.addColorStop(0, '#00ffff');
                    gradient.addColorStop(1, '#0088aa');
                } else {
                    gradient.addColorStop(0, '#ff00ff');
                    gradient.addColorStop(1, '#880088');
                }

                ctx.fillStyle = gradient;
                ctx.shadowColor = index === 0 ? '#00ffff' : '#ff00ff';
                ctx.shadowBlur = 10;
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
                ctx.shadowBlur = 0;
            });

            // 绘制食物
            const foodGradient = ctx.createRadialGradient(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                0,
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2
            );
            foodGradient.addColorStop(0, '#ffff00');
            foodGradient.addColorStop(1, '#ff8800');

            ctx.fillStyle = foodGradient;
            ctx.shadowColor = '#ffff00';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // 游戏循环
        function update() {
            if (!gameRunning) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // 撞墙检测
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // 撞自己检测
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // 吃食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                spawnFood();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            finalScoreEl.textContent = score;
            gameOverEl.classList.add('show');
        }

        function restartGame() {
            gameOverEl.classList.remove('show');
            resetGame();
            gameRunning = true;
            gameLoop = setInterval(update, gameSpeed);
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) {
                if (e.key === 'Enter' || e.key === ' ') {
                    restartGame();
                }
                return;
            }

            switch (e.key) {
                case 'ArrowUp':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
            }
            e.preventDefault();
        });

        // 触摸控制
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            if (!gameRunning) {
                restartGame();
            }
        }, {passive: true});

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, {passive: false});

        canvas.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].clientX;
            touchEndY = e.changedTouches[0].clientY;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            const minSwipe = 30;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (Math.abs(deltaX) > minSwipe) {
                    if (deltaX > 0 && dx !== -1) {
                        dx = 1; dy = 0;
                    } else if (deltaX < 0 && dx !== 1) {
                        dx = -1; dy = 0;
                    }
                }
            } else {
                if (Math.abs(deltaY) > minSwipe) {
                    if (deltaY > 0 && dy !== -1) {
                        dx = 0; dy = 1;
                    } else if (deltaY < 0 && dy !== 1) {
                        dx = 0; dy = -1;
                    }
                }
            }
        }

        // 窗口调整
        window.addEventListener('resize', () => {
            const oldSize = canvas.width;
            resizeCanvas();
            if (!gameRunning) drawGame();
        });

        // 初始化
        initGame();

        // 点击开始
        canvas.addEventListener('click', () => {
            if (!gameRunning) restartGame();
        });
    </script>
</body>
</html>
